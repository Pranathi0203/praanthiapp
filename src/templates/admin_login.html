<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero-card">
        <p class="eyebrow">Admin App</p>
        <h1>Operations dashboard access</h1>
        <p>Sign in to review who is logging in, logging out, and sending attendance activity.</p>
      </section>

      {% if msg %}<p class="error">{{ msg }}</p>{% endif %}

      <form method="post" action="/admin/login" class="card">
        <label>Email</label>
        <input name="email" type="email" required />

        <label>Password</label>
        <input name="password" type="password" required />

        <button class="btn" type="submit">Open admin dashboard</button>
      </form>

      <p><a href="/">Back home</a></p>
    </main>
  </body>
</html>
