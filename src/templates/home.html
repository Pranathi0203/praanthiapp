<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pranathi App</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Pranathi App</h1>
      <p>Tenant-aware attendance system built with FastAPI, PostgreSQL, IoT Hub, Azure Functions, Service Bus, and Redis.</p>
      {% if session_user %}
      <a class="btn" href="/dashboard">Go to dashboard</a>
      <a class="btn secondary" href="/logout">Logout</a>
      {% else %}
      <a class="btn" href="/signup">Create account</a>
      <a class="btn secondary" href="/login">Login</a>
      {% endif %}
    </main>
  </body>
</html>
