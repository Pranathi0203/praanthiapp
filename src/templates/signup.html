<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Create account</h1>
      {% if msg %}<p class="error">{{ msg }}</p>{% endif %}
      <form method="post" action="/signup" class="card">
        <label>Email</label>
        <input name="email" type="email" required />

        <label>Password</label>
        <input name="password" type="password" minlength="8" required />

        <label>Confirm password</label>
        <input name="confirm_password" type="password" minlength="8" required />

        <button class="btn" type="submit">Sign up</button>
      </form>
      <p>Supported tenant domains: <strong>contoso.com</strong> and <strong>litware.com</strong>.</p>
      <p>Already have an account? <a href="/login">Login</a></p>
      <p><a href="/">Back home</a></p>
    </main>
  </body>
</html>
