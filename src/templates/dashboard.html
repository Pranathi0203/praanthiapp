<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Dashboard</h1>
      <p class="ok">Welcome, <strong>{{ user_email }}</strong></p>
      <p>Organization: <strong>{{ organization|upper }}</strong></p>
      <div class="card">
        <p>You can see employees from your organization only.</p>
        <p><strong>Employees ({{ employees|length }})</strong></p>
        <ul>
          {% for e in employees %}
          <li>{{ e }}</li>
          {% endfor %}
        </ul>
        <a class="btn secondary" href="/logout">Logout</a>
      </div>
      <p><a href="/">Back home</a></p>
    </main>
  </body>
</html>
