name: CD - Terraform Apply + Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [ dev, qa ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: .

      - name: Parse image info
        run: |
          FULL_IMAGE=$(cat image.txt)
          echo "IMAGE_TAG=${FULL_IMAGE##*:}" >> $GITHUB_ENV
          echo "IMAGE_NAME=$(echo $FULL_IMAGE | awk -F/ '{print $2}' | awk -F: '{print $1}')" >> $GITHUB_ENV

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform init
        working-directory: infra/envs/${{ inputs.environment }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ vars.WEBAPP_NAME }}.tfstate"

      - name: Terraform plan
        working-directory: infra/envs/${{ inputs.environment }}
        run: |
          terraform plan \
            -var="location=${{ vars.LOCATION }}" \
            -var="rg_name=${{ vars.RG_NAME }}" \
            -var="acr_name=${{ secrets.ACR_NAME }}" \
            -var="acr_rg_name=${{ vars.ACR_RG_NAME }}" \
            -var="plan_name=${{ vars.PLAN_NAME }}" \
            -var="plan_sku=${{ vars.PLAN_SKU }}" \
            -var="webapp_name=${{ vars.WEBAPP_NAME }}" \
            -var="image_name=${IMAGE_NAME}" \
            -var="image_tag=${IMAGE_TAG}" \
            -var="container_port=${{ vars.CONTAINER_PORT }}" \
            -out=tfplan

      - name: Terraform apply
        working-directory: infra/envs/${{ inputs.environment }}
        run: terraform apply -auto-approve tfplan