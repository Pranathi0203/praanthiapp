name: CD - Terraform Apply + Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [ dev, qa ]
      image_tag:
        description: "ACR image tag to deploy (use a commit SHA from CI)"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform init
        working-directory: infra/envs/${{ inputs.environment }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ vars.WEBAPP_NAME }}.tfstate"

      - name: Terraform plan
        working-directory: infra/envs/${{ inputs.environment }}
        run: |
          terraform plan \
            -var="location=${{ vars.LOCATION }}" \
            -var="rg_name=${{ vars.RG_NAME }}" \
            -var="acr_name=${{ secrets.ACR_NAME }}" \
            -var="acr_rg_name=${{ vars.ACR_RG_NAME }}" \
            -var="plan_name=${{ vars.PLAN_NAME }}" \
            -var="plan_sku=${{ vars.PLAN_SKU }}" \
            -var="webapp_name=${{ vars.WEBAPP_NAME }}" \
            -var="image_name=myapp" \
            -var="image_tag=${{ inputs.image_tag }}" \
            -var="container_port=${{ vars.CONTAINER_PORT }}" \
            -out=tfplan

      - name: Terraform apply
        working-directory: infra/envs/${{ inputs.environment }}
        run: terraform apply -auto-approve tfplan