name: CD - Terraform Apply + Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [ dev, qa ]
      image_tag:
        description: "ACR image tag to deploy (use a commit SHA from CI)"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      
      - name: Debug Azure identity + subscription
        run: |
          az account show --query "{sub:id, tenant:tenantId, user:user.name}" -o table
          az ad sp show --id "${{ secrets.ARM_CLIENT_ID }}" --query "{displayName:displayName, appId:appId, objectId:id}" -o table

      
      - name: Debug ACR read (must succeed)
        run: |
          az acr show -n "pranathiappacr7182" -g "rg-pranathiapp-shared" --query "{name:name, id:id}" -o json

     
      - name: Terraform Init
        run: terraform init
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      
      - name: Terraform Plan
        run: |
          terraform plan \
            -var="location=westus3" \
            -var="rg_name=rg-pranathiapp-dev" \
            -var="acr_name=pranathiappacr7182" \
            -var="acr_rg_name=rg-pranathiapp-shared" \
            -var="plan_name=asp-pranathiapp-dev" \
            -var="plan_sku=B1" \
            -var="webapp_name=myappdev" \
            -var="image_name=myapp" \
            -var="image_tag=${{ github.sha }}" \
            -var="container_port=8000" \
            -out=tfplan
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
