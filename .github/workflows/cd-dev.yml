name: CD - Deploy DEV App (staging -> production)

on:
  workflow_run:
    workflows: ["CI - Build & Push"]
    types: [completed]

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: app-dev-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy_dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dev

    env:
      IMAGE_NAME: myapp

    steps:
      - uses: actions/checkout@v4

      - name: Download image tag artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read image tag
        id: meta
        run: |
          cat image.txt
          TAG="$(cut -d: -f2 image.txt)"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag=$TAG"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Ensure staging slot exists
        run: |
          if ! az webapp deployment slot show \
            --resource-group "${{ vars.RG_NAME }}" \
            --name "${{ vars.WEBAPP_NAME }}" \
            --slot staging >/dev/null 2>&1; then
            az webapp deployment slot create \
              --resource-group "${{ vars.RG_NAME }}" \
              --name "${{ vars.WEBAPP_NAME }}" \
              --slot staging \
              --configuration-source "${{ vars.WEBAPP_NAME }}"
          fi

      - name: Deploy container to staging slot
        run: |
          LOGIN_SERVER="$(az acr show -n "${{ secrets.ACR_NAME }}" --query loginServer -o tsv)"
          IMAGE_REF="$LOGIN_SERVER/${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}"
          echo "Deploying image: $IMAGE_REF"

          az webapp config container set \
            --resource-group "${{ vars.RG_NAME }}" \
            --name "${{ vars.WEBAPP_NAME }}" \
            --slot staging \
            --container-image-name "$IMAGE_REF"

          az webapp restart \
            --resource-group "${{ vars.RG_NAME }}" \
            --name "${{ vars.WEBAPP_NAME }}" \
            --slot staging

      - name: Swap staging to production
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ vars.RG_NAME }}" \
            --name "${{ vars.WEBAPP_NAME }}" \
            --slot staging \
            --target-slot production

      - name: Publish tag for QA
        run: |
          echo "${{ steps.meta.outputs.image_tag }}" > promoted_tag.txt

      - uses: actions/upload-artifact@v4
        with:
          name: promoted-tag
          path: promoted_tag.txt
