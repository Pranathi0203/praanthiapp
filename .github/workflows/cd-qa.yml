name: CD - Deploy QA App (staging only)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: app-qa-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy_qa:
    runs-on: ubuntu-latest
    environment: qa

    env:
      IMAGE_NAME: myapp

    steps:
      - uses: actions/checkout@v4

      - name: Download promoted tag artifact (from latest DEV run)
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: cd-dev.yml
          name: promoted-tag
          path: .

      - name: Read promoted tag
        id: meta
        run: |
          TAG="$(cat promoted_tag.txt)"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying QA with tag=$TAG"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Ensure staging slot exists
        run: |
          SLOT_ERR_FILE="$(mktemp)"
          CREATE_ERR_FILE="$(mktemp)"
          SLOT_READY="false"

          for attempt in {1..20}; do
            if az webapp deployment slot show \
              --resource-group "${{ vars.RG_NAME }}" \
              --name "${{ vars.WEBAPP_NAME }}" \
              --slot staging >/dev/null 2>"$SLOT_ERR_FILE"; then
              SLOT_READY="true"
              break
            fi

            if grep -q "ResourceNotFound" "$SLOT_ERR_FILE"; then
              echo "Staging slot not found, creating it (attempt $attempt/20)."
              if az webapp deployment slot create \
                --resource-group "${{ vars.RG_NAME }}" \
                --name "${{ vars.WEBAPP_NAME }}" \
                --slot staging \
                --configuration-source "${{ vars.WEBAPP_NAME }}" \
                >/dev/null 2>"$CREATE_ERR_FILE"; then
                SLOT_READY="true"
                break
              fi
            fi

            echo "Slot operation still busy or failed (attempt $attempt/20). Retrying in 15s..."
            sleep 15
          done

          if [ "$SLOT_READY" != "true" ]; then
            echo "Unable to verify or create staging slot after retries."
            [ -s "$SLOT_ERR_FILE" ] && cat "$SLOT_ERR_FILE"
            [ -s "$CREATE_ERR_FILE" ] && cat "$CREATE_ERR_FILE"
            exit 1
          fi

          rm -f "$SLOT_ERR_FILE" "$CREATE_ERR_FILE"

      - name: Deploy container to staging slot
        run: |
          LOGIN_SERVER="$(az acr show -n "${{ secrets.ACR_NAME }}" --query loginServer -o tsv)"
          IMAGE_REF="$LOGIN_SERVER/${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}"
          echo "Deploying image: $IMAGE_REF"

          az webapp config container set \
            --resource-group "${{ vars.RG_NAME }}" \
            --name "${{ vars.WEBAPP_NAME }}" \
            --slot staging \
            --container-image-name "$IMAGE_REF"

          az webapp restart \
            --resource-group "${{ vars.RG_NAME }}" \
            --name "${{ vars.WEBAPP_NAME }}" \
            --slot staging
