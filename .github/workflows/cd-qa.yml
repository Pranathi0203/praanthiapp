name: CD - Deploy QA (manual promotion)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: tf-qa-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy_qa:
    runs-on: ubuntu-latest
    environment: qa

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      IMAGE_NAME: myapp

    steps:
      - uses: actions/checkout@v4

      - name: Download promoted tag artifact (from latest DEV run)
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: cd-dev.yml
          name: promoted-tag
          path: .

      - name: Read promoted tag
        id: meta
        run: |
          TAG="$(cat promoted_tag.txt)"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Deploying QA with tag=$TAG"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform init (qa)
        working-directory: infra/envs/qa
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=qa/${{ vars.WEBAPP_NAME }}.tfstate"

      - name: Terraform apply (qa)
        working-directory: infra/envs/qa
        run: |
          terraform apply -auto-approve \
            -var="location=${{ vars.LOCATION }}" \
            -var="rg_name=${{ vars.RG_NAME }}" \
            -var="acr_name=${{ secrets.ACR_NAME }}" \
            -var="acr_rg_name=${{ vars.ACR_RG_NAME }}" \
            -var="plan_name=${{ vars.PLAN_NAME }}" \
            -var="plan_sku=${{ vars.PLAN_SKU }}" \
            -var="webapp_name=${{ vars.WEBAPP_NAME }}" \
            -var="image_name=${{ env.IMAGE_NAME }}" \
            -var="image_tag=${{ steps.meta.outputs.image_tag }}" \
            -var="container_port=${{ vars.CONTAINER_PORT }}"
