name: Terraform Apply (manual infra provisioning)

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [dev, qa]
      image_tag:
        description: Initial image tag for Web App container
        required: true
      allowed_client_cidr:
        description: CIDR allowed to access the app and SCM endpoints
        required: false
        default: 174.165.209.210/32

env:
  DEFAULT_ALLOWED_CLIENT_CIDR: 174.165.209.210/32

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-apply-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      IMAGE_NAME: myapp
      TF_VAR_location: ${{ vars.LOCATION }}
      TF_VAR_rg_name: ${{ vars.RG_NAME }}
      TF_VAR_acr_name: ${{ secrets.ACR_NAME }}
      TF_VAR_acr_rg_name: ${{ vars.ACR_RG_NAME }}
      TF_VAR_plan_name: ${{ vars.PLAN_NAME }}
      TF_VAR_plan_sku: ${{ vars.PLAN_SKU }}
      TF_VAR_webapp_name: ${{ vars.WEBAPP_NAME }}
      TF_VAR_image_name: myapp
      TF_VAR_image_tag: ${{ inputs.image_tag }}
      TF_VAR_container_port: ${{ vars.CONTAINER_PORT }}
      TF_VAR_allowed_client_cidr: ${{ inputs.allowed_client_cidr || env.DEFAULT_ALLOWED_CLIENT_CIDR }}
      TF_VAR_contoso_device_connection_string: ${{ secrets.CONTOSO_DEVICE_CONNECTION_STRING }}
      TF_VAR_litware_device_connection_string: ${{ secrets.LITWARE_DEVICE_CONNECTION_STRING }}
      TF_VAR_iothub_eventhub_connection_string: ${{ secrets.IOTHUB_EVENTHUB_CONNECTION_STRING }}
      TF_VAR_application_insights_connection_string: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Ensure Azure prerequisites exist
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

          for provider in Microsoft.Storage Microsoft.ContainerRegistry; do
            echo "Registering required bootstrap provider: $provider"
            az provider register --namespace "$provider" --wait
          done

          for provider in \
            Microsoft.Web \
            Microsoft.Network \
            Microsoft.DBforPostgreSQL \
            Microsoft.KeyVault \
            Microsoft.Cache \
            Microsoft.ServiceBus \
            Microsoft.Devices \
            Microsoft.ApiManagement; do
            echo "Starting provider registration in background: $provider"
            az provider register --namespace "$provider"
          done

          az group create \
            --name "${{ vars.TFSTATE_RG }}" \
            --location "${{ vars.LOCATION }}"

          az group create \
            --name "${{ vars.RG_NAME }}" \
            --location "${{ vars.LOCATION }}"

          az group create \
            --name "${{ vars.ACR_RG_NAME }}" \
            --location "${{ vars.LOCATION }}"

          if ! az storage account show --name "${{ vars.TFSTATE_STORAGE }}" --resource-group "${{ vars.TFSTATE_RG }}" >/dev/null 2>&1; then
            az storage account create \
              --name "${{ vars.TFSTATE_STORAGE }}" \
              --resource-group "${{ vars.TFSTATE_RG }}" \
              --location "${{ vars.LOCATION }}" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --allow-blob-public-access false \
              --min-tls-version TLS1_2
          fi

          STORAGE_KEY="$(az storage account keys list \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --account-name "${{ vars.TFSTATE_STORAGE }}" \
            --query '[0].value' -o tsv)"

          if ! az storage container exists \
            --name "${{ vars.TFSTATE_CONTAINER }}" \
            --account-name "${{ vars.TFSTATE_STORAGE }}" \
            --account-key "$STORAGE_KEY" \
            --query exists -o tsv | grep -qi true; then
            az storage container create \
              --name "${{ vars.TFSTATE_CONTAINER }}" \
              --account-name "${{ vars.TFSTATE_STORAGE }}" \
              --account-key "$STORAGE_KEY"
          fi

          if ! az acr show --name "${{ secrets.ACR_NAME }}" --resource-group "${{ vars.ACR_RG_NAME }}" >/dev/null 2>&1; then
            az acr create \
              --name "${{ secrets.ACR_NAME }}" \
              --resource-group "${{ vars.ACR_RG_NAME }}" \
              --location "${{ vars.LOCATION }}" \
              --sku Basic \
              --admin-enabled false
          fi

      - name: Terraform init
        working-directory: infra/envs/${{ inputs.environment }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ inputs.environment }}/${{ vars.WEBAPP_NAME }}.tfstate"

      - name: Import existing Key Vault secrets if needed
        if: ${{ inputs.environment == 'dev' }}
        working-directory: infra/envs/${{ inputs.environment }}
        run: |
          KV_NAME="$(terraform output -raw key_vault_name 2>/dev/null || true)"

          if [ -z "$KV_NAME" ]; then
            echo "No existing Terraform output for key_vault_name. Skipping secret import on first deployment."
            exit 0
          fi

          import_secret_if_needed() {
            local address="$1"
            local secret_name="$2"

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "$address is already tracked in Terraform state."
              return 0
            fi

            local secret_id
            secret_id="$(az keyvault secret show --vault-name "$KV_NAME" --name "$secret_name" --query id -o tsv 2>/dev/null || true)"

            if [ -z "$secret_id" ]; then
              echo "Secret $secret_name not found in Key Vault. Skipping import."
              return 0
            fi

            echo "Importing $secret_name into Terraform state."
            terraform import -lock-timeout=5m "$address" "$secret_id"
          }

          import_secret_if_needed 'module.app.azurerm_key_vault_secret.contoso_device_connection_string[0]' 'contoso-device-connection-string'
          import_secret_if_needed 'module.app.azurerm_key_vault_secret.litware_device_connection_string[0]' 'litware-device-connection-string'
          import_secret_if_needed 'module.app.azurerm_key_vault_secret.iothub_eventhub_connection_string[0]' 'iothub-eventhub-connection-string'
          import_secret_if_needed 'module.app.azurerm_key_vault_secret.application_insights_connection_string[0]' 'applicationinsights-connection-string'

      - name: Terraform apply
        working-directory: infra/envs/${{ inputs.environment }}
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "image_tag is required and must match a pushed ACR tag."
            exit 1
          fi

          terraform apply -auto-approve -lock-timeout=5m \
            -var="location=${{ vars.LOCATION }}" \
            -var="rg_name=${{ vars.RG_NAME }}" \
            -var="acr_name=${{ secrets.ACR_NAME }}" \
            -var="acr_rg_name=${{ vars.ACR_RG_NAME }}" \
            -var="plan_name=${{ vars.PLAN_NAME }}" \
            -var="plan_sku=${{ vars.PLAN_SKU }}" \
            -var="webapp_name=${{ vars.WEBAPP_NAME }}" \
            -var="image_name=${{ env.IMAGE_NAME }}" \
            -var="image_tag=${{ inputs.image_tag }}" \
            -var="container_port=${{ vars.CONTAINER_PORT }}" \
            -var="allowed_client_cidr=${{ inputs.allowed_client_cidr || env.DEFAULT_ALLOWED_CLIENT_CIDR }}" \
            -var="contoso_device_connection_string=${{ secrets.CONTOSO_DEVICE_CONNECTION_STRING }}" \
            -var="litware_device_connection_string=${{ secrets.LITWARE_DEVICE_CONNECTION_STRING }}" \
            -var="iothub_eventhub_connection_string=${{ secrets.IOTHUB_EVENTHUB_CONNECTION_STRING }}" \
            -var="application_insights_connection_string=${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}"
