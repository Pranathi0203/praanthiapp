name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mobile/pranathi-employee-android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/pranathi-employee-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pranathi-employee-debug-apk
          path: mobile/pranathi-employee-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
